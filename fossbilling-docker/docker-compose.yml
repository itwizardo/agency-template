version: '3.8'

services:
  fossbilling:
    image: fossbilling/fossbilling:latest
    container_name: fossbilling
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - TZ=Europe/Amsterdam
      - DB_HOST=db
      - DB_NAME=fossbilling
      - DB_USER=fossbilling
      - DB_PASSWORD=Gwc2024BillingSecure!
    volumes:
      - fossbilling_data:/var/www/html
    depends_on:
      - db
    networks:
      - fossbilling_network

  db:
    image: mariadb:10.11
    container_name: fossbilling_db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=GwcRoot2024Secure!
      - MYSQL_DATABASE=fossbilling
      - MYSQL_USER=fossbilling
      - MYSQL_PASSWORD=Gwc2024BillingSecure!
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - fossbilling_network

volumes:
  fossbilling_data:
  db_data:

networks:
  fossbilling_network:
    driver: bridge
